[project]
name = "singularity-payments"
version = "1.0.1"
description = "SDK for Mpesa payments."
readme = "README.md"
authors = [
    { name = "mtume", email = "mtume2016@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
singularity-payments = "singularity_payments:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
